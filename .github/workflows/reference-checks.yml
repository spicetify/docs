name: Reference checks
on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-commands:
    name: CLI command reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download the latest v3 CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R spicetify/cli --exclude-drafts --limit 100 \
            --json tagName --jq '[.[] | select(.tagName | startswith("v3."))][0].tagName')
          if [ -z "$tag" ]; then echo "No v3 release found" >&2; exit 1; fi
          echo "Using spicetify/cli $tag"
          asset="spicetify-${tag#v}-linux-x86_64.tar.zst"
          mkdir -p "$RUNNER_TEMP/cli"
          cd "$RUNNER_TEMP/cli"
          gh release download "$tag" -R spicetify/cli -p "$asset" -p "$asset.sha256"
          echo "$(cat "$asset.sha256")  $asset" | sha256sum -c -
          tar --zstd -xf "$asset" spicetify

      - name: Check CLI command reference
        run: node scripts/check-cli-commands.mjs "$RUNNER_TEMP/cli/spicetify"

  api-wrapper:
    name: API wrapper reference
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API wrapper reference
        run: pnpm run check:api-wrapper
